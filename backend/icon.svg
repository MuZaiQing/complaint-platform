<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="投诉预警平台图标">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101216"/>
      <stop offset="1" stop-color="#0B0C10"/>
    </linearGradient>
    <linearGradient id="barA" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#00D8FF" stop-opacity=".35"/>
      <stop offset="1" stop-color="#00D8FF"/>
    </linearGradient>
    <linearGradient id="barB" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#FF9533" stop-opacity=".35"/>
      <stop offset="1" stop-color="#FF9533"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#00D8FF" stop-opacity=".28"/>
      <stop offset="1" stop-color="#00D8FF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <circle cx="256" cy="300" r="210" fill="url(#glow)"/>

  <!-- 趋势折线 -->
  <path d="M84 336 L156 268 L228 300 L300 208 L372 240 L428 152"
        fill="none" stroke="#2DD4A7" stroke-width="10" stroke-linecap="round"
        stroke-linejoin="round" opacity=".85"/>

  <!-- 柱状 -->
  <g>
    <rect x="96" y="352" width="42" height="76" rx="10" fill="url(#barA)"/>
    <rect x="160" y="316" width="42" height="112" rx="10" fill="url(#barA)"/>
    <rect x="224" y="376" width="42" height="52" rx="10" fill="url(#barA)"/>
    <rect x="288" y="296" width="42" height="132" rx="10" fill="url(#barB)"/>
    <rect x="352" y="342" width="42" height="86" rx="10" fill="url(#barB)"/>
  </g>

  <!-- 预警点 -->
  <circle cx="428" cy="152" r="26" fill="#F2555A" opacity=".22"/>
  <circle cx="428" cy="152" r="12" fill="#F2555A"/>
</svg>
